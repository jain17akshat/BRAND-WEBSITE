                    <p className="text-[10px] text-gray-500">{p.purity}</p>
                    
                    <div className="pt-2 flex items-center justify-between border-t border-[#F2EBDC]">
                      <span className="font-cinzel text-sm font-bold text-[#2C2623]">₹{p.price.toLocaleString('en-IN')}</span>
                      <button
                        onClick={() => addToCart(p)}
                        className="px-3 py-1.5 bg-[#231E1C] text-[#E5C378] text-[10px] font-cinzel font-bold uppercase rounded hover:bg-[#3A3431]"
                      >
                        + Add
                      </button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </section>

          {/* Cart Drawer */}
          {cartOpen && (
            <div className="fixed inset-0 z-50 flex justify-end bg-black/50 backdrop-blur-xs">
              <div className="w-full max-w-md bg-[#FBF9F5] p-6 h-full flex flex-col justify-between shadow-2xl">
                <div>
                  <div className="flex justify-between items-center border-b border-[#EAE0CD] pb-4">
                    <h3 className="font-cinzel text-lg font-bold text-[#2C2623]">Your Sacred Cart</h3>
                    <button onClick={() => setCartOpen(false)} className="text-xl">✕</button>
                  </div>

                  <div className="py-4 space-y-3">
                    {cart.map(item => (
                      <div key={item.id} className="flex justify-between items-center bg-white p-3 rounded border border-[#EAE0CD]">
                        <div>
                          <h4 className="font-cinzel text-xs font-bold text-[#2C2623]">{item.name}</h4>
                          <span className="text-[10px] text-gray-500">Qty: {item.quantity} • ₹{(item.price * item.quantity).toLocaleString('en-IN')}</span>
                        </div>
                        <button onClick={() => setCart(cart.filter(i => i.id !== item.id))} className="text-xs text-red-700">Remove</button>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="border-t border-[#EAE0CD] pt-4 space-y-3">
                  <div className="flex justify-between font-cinzel font-bold text-sm text-[#2C2623]">
                    <span>Total:</span>
                    <span>₹{subtotal.toLocaleString('en-IN')}</span>
                  </div>
                  <button
                    onClick={() => { setCartOpen(false); setCheckoutOpen(true); }}
                    className="w-full py-3.5 bg-[#231E1C] text-[#E5C378] font-cinzel text-xs font-bold uppercase tracking-widest rounded"
                  >
                    Proceed to Checkout
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Checkout Simulator Modal */}
          {checkoutOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60">
              <div className="bg-[#FBF9F5] p-8 rounded-xl max-w-md w-full border border-[#C5A059] shadow-2xl text-center space-y-4">
                <h3 className="font-cinzel text-xl font-bold text-[#2C2623]">Auspicious Checkout</h3>
                <p className="text-xs text-gray-600">Total payable: <strong className="text-[#967433]">₹{subtotal.toLocaleString('en-IN')}</strong></p>
                <div className="p-3 bg-white rounded border border-[#EAE0CD] text-left text-xs space-y-1">
                  <div><strong>Delivery Address:</strong> HSR Layout, Bengaluru, 560102</div>
                  <div><strong>Payment Method:</strong> UPI / NetBanking / COD</div>
                </div>
                <button
                  onClick={() => { alert('✨ Order Placed Successfully! Order ID: SHRAVIKO-982314'); setCheckoutOpen(false); setCart([]); }}
                  className="w-full py-3 bg-[#C5A059] text-[#171312] font-cinzel font-bold text-xs uppercase rounded"
                >
                  Place Order Now
                </button>
                <button onClick={() => setCheckoutOpen(false)} className="text-xs text-gray-500">Cancel</button>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-[#231E1C] text-[#E5C378] px-4 py-3 rounded shadow-2xl border border-[#C5A059] font-cinzel text-xs uppercase tracking-wider animate-bounce">
              ✨ {toast}
            </div>
          )}

          {/* Sacred Video Reels & Presentation Showcase */}
          <section className="py-16 px-6 max-w-7xl mx-auto w-full border-t border-[#EAE0CD] bg-[#FBF9F5]">
            <div className="text-center max-w-3xl mx-auto mb-12 space-y-3">
              <span className="px-3.5 py-1 rounded-full bg-[#FAF0D9] border border-[#EAD7AF] text-[#755722] text-xs font-cinzel tracking-widest uppercase inline-block">
                🎬 Sacred Video Reels
              </span>
              <h2 className="text-2xl sm:text-4xl font-cinzel font-bold text-[#2C2623]">
                Artisan Stories & Craft in Motion
              </h2>
              <p className="text-xs sm:text-sm text-gray-500 font-sans font-light">
                Click any reel below to expand and view in full-screen presentation
              </p>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
              {[
                '/assets/Video1.mp4',
                '/assets/Video2.mp4',
                '/assets/Video 3.mp4',
                '/assets/Video5.mp4'
              ].map((url, idx) => (
                <div
                  key={idx}
                  onClick={() => setPopupVideo(url)}
                  className="group relative rounded-2xl overflow-hidden bg-black aspect-[9/16] shadow-md hover:shadow-2xl border border-[#EAE0CD] hover:border-[#C5A059] cursor-pointer transition-all duration-500"
                >
                  <video src={url} autoPlay loop muted playsInline preload="auto" className="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-700 ease-out" />
                </div>
              ))}
            </div>
          </section>

          {/* Pop-up Video Reel Modal */}
          {popupVideo && (
            <div
              className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4 animate-fade-in"
              onClick={() => setPopupVideo(null)}
            >
              <div
                className="relative max-w-sm sm:max-w-md w-full aspect-[9/16] bg-black rounded-3xl overflow-hidden shadow-2xl border border-[#C5A059] flex items-center justify-center"
                onClick={(e) => e.stopPropagation()}
              >
                <button
                  onClick={() => setPopupVideo(null)}
                  className="absolute top-4 right-4 z-30 w-10 h-10 rounded-full bg-black/70 hover:bg-black text-white border border-white/30 flex items-center justify-center transition-all shadow-lg text-lg cursor-pointer"
                >
                  ✕
                </button>
                <video src={popupVideo} autoPlay controls loop playsInline className="w-full h-full object-cover" />
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-[#171312] text-gray-400 py-10 px-6 text-center text-xs font-cinzel border-t border-[#C5A059]/30">
            <p>© {new Date().getFullYear()} Shraviko Sacred Living Pvt Ltd. Pure Indian Pooja Essentials.</p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StandaloneApp />);
  </script>
</body>
</html>
