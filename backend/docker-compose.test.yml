version: '3.8'

services:
  test-mysql:
    image: mysql:8.0
    container_name: shraviko-test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: testrootpassword
      MYSQL_DATABASE: shraviko_test
      MYSQL_USER: shraviko_test_user
      MYSQL_PASSWORD: testpassword123
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptestrootpassword"]
      timeout: 20s
      retries: 10
